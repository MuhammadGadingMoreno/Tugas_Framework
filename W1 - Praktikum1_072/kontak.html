          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="index.html">Latihan HTML</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>

        <div class="collapse navbar-collapse" id="navbarNav">

                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1>Form Kontak</h1>

    <form>
        <div class="mb-3">
            <label for="nama" class="form-label">Nama</label>
            <input type="text" class="form-control" id="nama" placeholder="Masukkan nama">
        </div>

        <div class="mb-3">
            <label for="pesan" class="form-label">Pesan</label>
            <textarea class="form-control" id="pesan" rows="3"
                      placeholder="Masukkan pesan"></textarea>
        </div>

        <div class="mb-3">
            <label for="prodi" class="form-label">Program Studi</label>
            <select class="form-select" id="prodi">
                <option selected>Pilih program studi</option>
                <option>Teknologi Rekayasa Perangkat Lunak</option>
                <option>Teknologi Rekayasa Logistik</option>
                <option>Teknologi Rekayasa Pemeliharaan Alat Berat</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Jenis Kelamin</label>
            <div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="laki">
                    <label class="form-check-label" for="laki">Laki-laki</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="perempuan">
                    <label class="form-check-label" for="perempuan">Perempuan</label>
                </div>
            </div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="setuju">
            <label class="form-check-label" for="setuju">
                Saya menyetujui pengiriman form.
            </label>
        </div>

        <button type="submit" class="btn btn-success">Kirim</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
